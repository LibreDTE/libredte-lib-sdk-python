name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  tests:
    name: Tests
    timeout-minutes: 10
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14']

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Display Python version
        run: python --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Run Ruff (lint)
        run: ruff check .

      - name: Run Ruff (format)
        run: ruff format --check .

      - name: Run mypy
        run: mypy

      # No corre los tests `live` (marker `live`, excluidos por defecto vía
      # `addopts` en pyproject.toml): golpean la API real de LibreDTE y/o
      # un ambiente de desarrollo local, no algo apto para CI.
      - name: Run pytest
        run: |
          mkdir -p var
          pytest -v \
            --junitxml=var/tests-results.xml \
            --cov=libredte_lib_sdk \
            --cov-report=xml:var/tests-coverage.xml

      - name: Upload pytest result report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tests-results-python_${{ matrix.python-version }}.xml
          path: var/tests-results.xml

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: tests-coverage-python_${{ matrix.python-version }}.xml
          path: var/tests-coverage.xml
