# .readthedocs.yaml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  jobs:
    # La referencia de API (docs/libredte_lib_sdk*.rst, docs/modules.rst)
    # no se commitea: se regenera acá a partir de los docstrings, igual
    # que hace `make docs` en local.
    pre_build:
      - sphinx-apidoc -o docs/ libredte_lib_sdk --force --separate

sphinx:
  configuration: docs/conf.py

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
